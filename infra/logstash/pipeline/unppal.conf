input {
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/unppal.sincedb"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "unppal-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}

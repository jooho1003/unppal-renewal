server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: interpretation-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: interpretation-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      acks: all
      properties:
        enable.idempotence: true

  data:
    mongodb:
      uri: ${MONGODB_URI}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo
logging:
  file:
    name: ${LOG_FILE:./logs/interpretation-service.log}
  structured:
    format:
      file: ecs

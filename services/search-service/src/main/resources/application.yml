server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: search-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      acks: all
      properties:
        enable.idempotence: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,elasticsearch
logging:
  file:
    name: ${LOG_FILE:./logs/search-service.log}
  structured:
    format:
      file: ecs
